name: Build Feature Branch

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: build-feature-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requires

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requires
          pip install coverage

      - name: Create results folder
        run: mkdir -p results

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m coverage run --source=app -m unittest discover -s test/unit -p "*_test.py"
          python -m coverage xml -o results/coverage.xml
          python -m coverage html -d results/coverage

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            results/coverage.xml
            results/coverage/

      - name: Build summary
        run: echo "Python pipeline completed successfully"

  merge-feature-into-develop:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ success() }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"

      - name: Fetch all branches
        run: git fetch origin

      - name: Merge feature branch into develop
        run: |
          git merge --no-ff \
            origin/${{ github.event.pull_request.head.ref }} \
            -m "Auto merge PR #${{ github.event.number }} into develop"

      - name: Push merged changes
        run: |
          git push origin develop

      - name: trigger deploy artifact
        if: success()
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          event-type: build-and-publish-docker
          client-payload: '{"ref": "${{ github.event.pull_request.head.ref }}", "checksum": "${{ github.event.pull_request.head.sha }}"}'