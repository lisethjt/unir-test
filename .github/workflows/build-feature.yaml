name: Build Feature Branch

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: build-feature-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requires

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requires

      - name: Create results folder
        run: mkdir -p results

      - name: Run unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          PYTHONPATH=. python -m pytest -p pytest_cov -m unit \
            --cov \
            --cov-report=xml:results/coverage.xml \
            --cov-report=html:results/coverage \
            --junit-xml=results/unit_result.xml

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            results/unit_result.xml
            results/coverage.xml
            results/coverage/

      - name: Build summary
        run: echo "Python pipeline completed with unit tests only"

  merge-feature-into-develop:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ success() }}
    #[For a specific job, you can use jobs.<job_id>.permissions to modify the default permissions granted to the GITHUB_TOKEN](https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs)
    permissions:
      contents: write
      pull-requests: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
      - name: Merge to develop branch
        if: ${{ success() }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "ljimeneztorres@gmail.com"
          git merge --no-ff --verbose origin/${{ github.event.pull_request.head.ref }} -m "Merge pull request ${{ github.event.number }} into develop"

      - name: Push changes after merge
        if: ${{ success() }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.base_ref }}

